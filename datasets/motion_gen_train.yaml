debug: true
seed: 39 # random seed
exp_name: motion_gen_test # name for this experiment in the local run directory and on wandb
mode: train # mode: one of 'train', 'eval', or 'sample'
stage: 2 # the stage of training to start from
n_epochs: null # the number of epochs to train for; if null, must specify n_examples
cache_dir: cache 
ckpt_dir: outputs/ckpt
# resume_ckpt: null # the path to a checkpoint to resume training from
# 1000 B=128
resume_ckpt: null # the path to a checkpoint to resume training from

model:
  module_name: model.lightning.motion_gen
  class_name: MotionGenModule
  denoising_model:
    module_name: models.motion_gen
    class_name: INFPDiffusionTransformer
  motion_encoder:
    module_name: head_animation.LIA.motion_encoder 
    class_name: MotionEncoder
    latent_dim: 512
    size: ${data.train_width}
  activation_checkpointing_models: 
    - module_name: models.motion_gen
      class_name: INFPDiffusionTransformerBlock
    # - module_name: model_dit.models.hyvideo.modules.models
    #   class_name: MMDoubleStreamBlock-
  
  base_model_path: null
  dtype: torch.bfloat16
  base_model_from_scratch: true

  vae_model_path: ./epoch=0-step=10000.ckpt
  dit_model_path: ./outputs/ckpt/motion_gen_train/epoch=0-step=400.ckpt
  # motion_encoder_path: ./epoch=0-step=45000.ckpt
  motion_encoder_path:  ../epoch=7-step=305000.ckpt # /mnt/weka/hw_workspace/xl_workspace/real-time-video-gen-proj/new_main/real-time-video-gen/head_animator_finetune/motion-space-20_vggloss-0.001_ganloss-0_faceloss-5e-05_lr-0.0002_facemask-True/ckpt/epoch=1-step=27500.ckpt
  # /mnt/weka/hw_workspace/xl_workspace/real-time-video-gen-proj/new_main/real-time-video-gen/head_animator_htdf/motion-space-20_vgg-0_gan-0_face-0_face-L1-0.2_lr-0.0002_facemask-True/ckpt/epoch=7-step=305000.ckpt
  vae_dtype: torch.bfloat16
  clip_name: null
  n_embedding: 1024
  latent_dim: 512
  latents_dim: ${model.latent_dim}



logger:
  neptune_project: real-time-video-gen/ # null is None, TODO, need to change accordingly
  neptune_api_token: eyJhcGlfYWRkcmVzcyI6Imh0dHBzOi8vYXBwLm5lcHR1bmUuYWkiLCJhcGlfdXJsIjoiaHR0cHM6Ly9hcHAubmVwdHVuZS5haSIsImFwaV9rZXkiOiIwN2ZhODIzOC02ZmYwLTQ3ZmYtODQ0OC01ODE1ZjQxNDI0YTQifQ==
  # wandb configuration
  wandb:
    enabled: true
    entity: null
    project: "real-time"

# callbacks settings
callbacks:
  # - module_name: model_dit.utils.callbacks
  #   class_name: BasicCallback
    # config: config
  - module_name: lightning.pytorch.callbacks
    class_name: ModelCheckpoint
    dirpath: ${ckpt_dir}/${exp_name} # where to save the checkpoints
    every_n_train_steps: 100 # how often to save checkpoints
    # filename: run_name + '{epoch}-{step}' # the filename for the checkpoints
    save_top_k: -1 # -1, save all checkpoints

trainer:
  accelerator: gpu
  # strategy: DDPStrategy(find_unused_parameters=True) #fsdp
  # sharding_strategy: NO_SHARD
  precision: bf16-true # bf16-mixed
  enable_checkpointing: true
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  gradient_clip_algorithm: value
  log_every_n_steps: 1
  val_check_interval: 250 # evaluate the model every eval_every steps

# loss settings
loss:
  snr_gamma: 5.0
  zero_embedding: true
  uncond_ratio: 0.1
  noise_offset: 0.05
  ref_image_blur: false
  l_w_recon: 1
  l_w_embedding: 1
  l_w_commitment: 0.25
  

# scheduler settings
noise_scheduler: "flow" # 'ddim'
scheduler:
  num_train_timesteps: 1000
  
  flow_shift: 5.0
  flow_reverse: True
  flow_solver: euler

  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29

ddim_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:          0.00085
  beta_end:            0.012
  beta_schedule:       "linear"
  steps_offset:        1
  clip_sample:         false

# optimizer settings
optimizer:
  lr: 1e-4 # the learning rate
  warmup_steps: 0 # number of linear warmup steps for the learning rate
  adam_beta1: 0.9 # beta1 for the Adam optimizer
  adam_beta2: 0.999 # beta2 for the Adam optimizer
  adam_epsilon: 1.0e-08 # epsilon for the Adam optimizer
  weight_decay: 1.0e-2 # the weight decay

data:
  train_bs: 1
  train_width: 512 
  train_height: 512 
  hybrid_face_mask: True
  mouth_bbox_scale: 1.4 # mouth bounding box scale for mediapipe's detection
  eye_bbox_scale: 1.6 # eye bounding box scale for mediapipe's detection

  root_video_paths:
    - '/mnt/weka/training_data_1/hdtf_full/videos_resampled'
  meta_paths:
    - '/mnt/weka/training_data_1/hdtf_full/metadata'
  target_dataset_sample_rate:
    - 1
    - 1
  mediapipe_mask:
    - False
    - True
  convert_mediapipe_to_s3fd: True
  
  n_sample_frames: 15
  past_n: 3
  train_fps: 15
  dataloader: EmoVideoDatasetAlex
  train_mask_scale: 1.0
  audio_fea_type: 'wav2vec2_type2'

  # Alex dataset args
  audio_offset_thresh: 2    # bigger to see more 
  audio_conf_thresh: 6      # lower for lower confidence necessary
  union_bbox_scale: 1.5
  # union_bbox_scale: [1.7, 4.0]      # For Alex dataset when the videos are not cropped in processing
  start_margin: 5     # how late to start
  filter_hand_videos: True
  zoom_out: True
  zoom_out_ratio: [0.65, 1.0]
  clip_after_augmentation: True

  num_workers: 16

test_data:
  height: 384
  width: 672
  image_paths_and_scales:
    - [/mnt/weka/test_data/general/001_768x768.jpg, 33]
    - [/mnt/weka/test_data/general/002_768x768.jpg, 33]
    - [/mnt/weka/test_data/general/003_768x768.jpg, 33]
    - [/mnt/weka/test_data/general/004_768x768.jpg, 33]
    - [/mnt/weka/test_data/general/005_768x768.jpg, 33]
    # - [/mnt/weka/hw_workspace/sr_workspace/emo-dit-YXC/test_img/EeZp9T0XKUo.jpg, 1.2]

inference:
  output_dir: outputs/inference
  num_inference_steps: 20
  guidance_scale: 1.0
  repeat_times: 1